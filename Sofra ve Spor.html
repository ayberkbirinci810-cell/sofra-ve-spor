<style>
:root{
  /* Düzen: tek sütun, alt sekme çubuğu, koyu vurgulu özet kartı + beyaz kartlar.
     Yazı: sistem yazı tipi (iPhone'da SF Pro), rakamlar ve başlıklar yuvarlak kesim.
     Renkler JS'teki paletlerden (Orman, Mercan, Okyanus, Erik) atanır; buradakiler Orman/açık varsayılanıdır. */
  --bg:#F3F6F3;--card:#FFFFFF;--ink:#0F1F18;--muted:#5C6B63;--line:#E2E8E3;--field:#F1F4F1;
  --accent:#0E8A5F;--on-accent:#FFFFFF;--soft:#DDF3E8;--hero:#0E3B2E;--ring:#7FE5B4;
  --pro:#D94A60;--carb:#C98A06;--fat:#0E9A8A;--good:#178A55;--good-soft:#DDF3E7;--note:#7A5200;--note-bg:#FFF3D6;
  --fb:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --fd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:24px;--shadow:0 1px 2px rgba(15,25,20,.04),0 6px 18px rgba(15,25,20,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A110E;--card:#131C18;--ink:#EAF2EE;--muted:#92A39A;--line:#222E28;--field:#19231E;
    --accent:#46D39C;--on-accent:#04261A;--soft:#153326;--hero:#123D30;--ring:#7FE5B4;
    --pro:#F27C8D;--carb:#F0BC4A;--fat:#3FCDBD;--good:#4FCB8F;--good-soft:#163326;--note:#F3D48A;--note-bg:#2B2413;
    --shadow:0 0 0 1px #222E28;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A110E;--card:#131C18;--ink:#EAF2EE;--muted:#92A39A;--line:#222E28;--field:#19231E;
  --accent:#46D39C;--on-accent:#04261A;--soft:#153326;--hero:#123D30;--ring:#7FE5B4;
  --pro:#F27C8D;--carb:#F0BC4A;--fat:#3FCDBD;--good:#4FCB8F;--good-soft:#163326;--note:#F3D48A;--note-bg:#2B2413;
  --shadow:0 0 0 1px #222E28;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:30px;font-weight:800;line-height:1.1}h2{font-size:21px;font-weight:750}h3{font-size:17px;font-weight:700}
p{margin:0}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}.sm{font-size:14.5px}.xs{font-size:12.5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

function asDef() {
  return {
    on: true, cats: { bes: true, su: true, ant: true, kilo: true, mot: true },
    quiet: { from: '22:30', to: '08:00' }, max: 3, freq: 'normal', level: 'kisisel',
    perm: '', plan: [], log: [], pause: {},
    learn: { useH: new Array(24).fill(0), useD: new Array(7).fill(0), open: {}, resp: {}, seen: {}, lastUse: '' }
  };
}
function asMerge(raw) {
  // Eski sürümden gelen ya da eksik alanlı veriyi varsayılanlarla tamamlar (geriye dönük uyum).
  const b = asDef(); if (!isObj(raw)) return b;
  if (typeof raw.on === 'boolean') b.on = raw.on;
  if (isObj(raw.cats)) for (const k in b.cats) if (typeof raw.cats[k] === 'boolean') b.cats[k] = raw.cats[k];
  if (isObj(raw.quiet) && /^\d\d:\d\d$/.test(raw.quiet.from) && /^\d\d:\d\d$/.test(raw.quiet.to)) b.quiet = { from: raw.quiet.from, to: raw.quiet.to };
  if (raw.max >= 1 && raw.max <= 6) b.max = Math.round(raw.max);
  if (['az', 'normal', 'sik'].includes(raw.freq)) b.freq = raw.freq;
  if (['sade', 'kisisel', 'detayli'].includes(raw.level)) b.level = raw.level;
  if (typeof raw.perm === 'string') b.perm = raw.perm;
  if (Array.isArray(raw.plan)) b.plan = raw.plan.filter(x => isObj(x) && x.id && x.at);
  if (Array.isArray(raw.log)) b.log = raw.log.filter(x => isObj(x) && x.id && x.at).slice(0, 40);
  if (isObj(raw.pause)) b.pause = raw.pause;
  if (isObj(raw.learn)) {
    const L = raw.learn;
    if (Array.isArray(L.useH) && L.useH.length === 24) b.learn.useH = L.useH.map(x => +x || 0);
    if (Array.isArray(L.useD) && L.useD.length === 7) b.learn.useD = L.useD.map(x => +x || 0);
    for (const k of ['open', 'resp', 'seen']) if (isObj(L[k])) b.learn[k] = L[k];
    if (typeof L.lastUse === 'string') b.learn.lastUse = L.lastUse;
  }

const Cloud = {
  col: null, on: false, timer: 0, busy: false, dirty: false, last: 0,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection('data/users/' + id);
      const meta = await this.col.doc('meta').get();
      this.on = true;
      if (meta.exists) {
        const m = meta.data();
        if (m && m.t > (S.t || 0) && m.n > 0) {
          let json = '';
          for (let i = 0; i < m.n; i++) { const c = await this.col.doc('p' + i).get(); if (!c.exists) return; json += c.data().s || ''; }
          const st = adopt(JSON.parse(json));
          if (st.profile || !S.profile) { S = st; S.t = m.t; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} applyTheme(); render(); toast('Bulut yedeğindeki veriler yüklendi'); }
        } else if ((S.t || 0) > (m && m.t || 0)) this.queue();
        this.last = m && m.t || 0;
      } else if (S.profile) this.queue();
      if (U.tab === 'profil') render();
    } catch (e) { this.on = false; }
  },
  queue() {
    if (!this.on) return;
    this.dirty = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 4000);
  },
  async push() {
    if (!this.on || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    try {
      const json = JSON.stringify(S), t = S.t, parts = [];
      for (let i = 0; i < json.length; i += 90000) parts.push(json.slice(i, i + 90000));
      for (let i = 0; i < parts.length; i++) await this.col.doc('p' + i).set({ s: parts[i] });
      await this.col.doc('meta').set({ t, n: parts.length });
      this.last = t;
    } catch (e) { /* sessizce geç: yerel kayıt zaten duruyor */ }
    this.busy = false;
    if (this.dirty) this.queue();
  }
};

/* ---------- Hesaplamalar: kalori ve makro hedefi ---------- */
const ACT = { 1: 1.2, 2: 1.375, 3: 1.55, 4: 1.725 };
const ACT_N = { 1: 'Hareketsiz', 2: 'Az aktif', 3: 'Orta', 4: 'Çok aktif' };
const GOAL_N = { ver: 'Kilo vermek', koru: 'Korumak', kas: 'Kas kazanmak' };
const kcalFloor = sex => sex === 'k' ? 1200 : 1500;
function calc(p) {
  p = p || S.profile;
  if (!p) return null;
  const bmr = 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex === 'e' ? 5 : -161); // Mifflin-St Jeor
  const tdee = bmr * (ACT[p.act] || 1.2);
  const floor = kcalFloor(p.sex);
  let auto = tdee;
  const minor = p.age < 18 && p.goal === 'ver'; // 18 yaş altında kalori açığı uygulanmaz
  if (p.goal === 'ver' && !minor) auto = tdee - Math.min(500, tdee * 0.2);
  else if (p.goal === 'kas') auto = tdee + 250;
  auto = Math.max(floor, r0(auto / 10) * 10);
  const minAllowed = minor ? r0(tdee / 10) * 10 : Math.max(floor, r0((tdee - 750) / 10) * 10); // haftada en fazla ~0,75 kg
  let kcal = auto, manual = false;
  if (p.manual && p.manual >= minAllowed) { kcal = r0(p.manual); manual = true; }
  const prot = r0(1.6 * p.w);
  const fat = r0(Math.max(0.8 * p.w, kcal * 0.27 / 9));
  const carb = Math.max(0, r0((kcal - prot * 4 - fat * 9) / 4));
  let rate = (tdee - kcal) * 7 / 7700; // kg/hafta (+ kayıp)
  rate = clamp(rate, -0.5, 0.75);
  let eta = null;
  if (p.goal === 'ver' && p.goalW < p.w && rate > 0.05) eta = addDays(today(), r0((p.w - p.goalW) / rate * 7));
  if (p.goal === 'kas' && p.goalW > p.w && rate < -0.05) eta = addDays(today(), r0((p.goalW - p.w) / -rate * 7));
  return { bmr: r0(bmr), tdee: r0(tdee), floor, auto, minAllowed, kcal, manual, prot, fat, carb, rate, eta, minor };
}

  const bd = [['5 gün üst üste kayıt', best >= 5, Math.min(cur, 5) + '/5'], ['Bu hafta 3 antrenman', wkW >= 3, wkW + '/3'], ['10 gün su hedefi', wd >= 10, Math.min(wd, 10) + '/10'], ['14 gün üst üste kayıt', best >= 14, Math.min(Math.max(cur, 0), 14) + '/14'], ['İlk kilo ölçümü', wk.length >= 1, wk.length ? '1/1' : '0/1'], ['İlk paket takvimde', S.pk.hist.some(x => !x.fav), S.pk.hist.some(x => !x.fav) ? '1/1' : '0/1']];
  h += `<section class="card"><div class="row"><h3 class="sp">Seriler ve rozetler</h3><span class="mid">${cur} gün</span></div>
<p class="sm mut">${cur > 0 ? cur + ' gündür kayıt tutuyorsun. En uzun serin ' + best + ' gün.' : Object.keys(S.days).length ? 'Tekrar başlamak için harika bir gün. Seri bugün yeniden başlayabilir.' : 'İlk kaydınla seri başlar.'}</p>
<div class="grid2">${bd.map(b => `<div class="stat" style="${b[1] ? 'background:var(--soft)' : ''}"><div class="row" style="gap:6px"><span class="chk${b[1] ? ' on' : ''}" style="width:22px;height:22px;font-size:13px">✓</span><b style="font-size:13.5px;font-family:var(--fb)">${b[0]}</b></div><span>${b[1] ? 'kazanıldı' : b[2]}</span></div>`).join('')}</div></section>`;
  // Açlık ve ruh hali örüntüsü
  const mood = { k: 0, o: 0, a: 0, s: 0 }, notes = []; let any = 0;
  for (let i = 0; i < 14; i++) { const k = addDays(td, -i), d = S.days[k]; if (!d) continue; for (const m of MEALS) { const f = d.f[m.id]; if (!f) continue; if (f.h) any++; if (f.h === 'ac') mood[m.id]++; if (f.n) notes.push({ k, m: m.n, n: f.n, h: f.h }); } }
  if (any || notes.length) {
    const top = MEALS.filter(m => mood[m.id] >= 2).sort((a, b) => mood[b.id] - mood[a.id])[0];
    h += `<section class="card"><h3>Açlık ve his notları <span class="xs mut">son 14 gün</span></h3>
<p class="sm">${top ? `${top.n} öğününden sonra ${mood[top.id]} kez "hâlâ aç" işaretledin. O öğüne biraz protein ya da lif eklemek doygunluğu uzatabilir.` : 'Belirgin bir açlık örüntüsü görünmüyor.'}</p>
${notes.slice(0, 6).map(n => `<div class="li" style="min-height:44px"><div class="sp"><div class="sm">${esc(n.n)}</div><div class="xs mut">${nice(n.k)} · ${n.m}${n.h ? ' · ' + ({ tok: 'tok', normal: 'normal', ac: 'hâlâ aç' })[n.h] : ''}</div></div></div>`).join('')}</section>`;
  }
  return h;
};

function suValidate(su) {
  const age = r0(num(su.age)), h = num(su.h), w = num(su.w); let g = num(su.goalW);
  if (!(age >= 13 && age <= 95)) return { msg: 'Yaşını kontrol eder misin?' };
  if (!(h >= 120 && h <= 230)) return { msg: 'Boyu santimetre olarak gir (ör. 172).' };
  if (!(w >= 30 && w <= 300)) return { msg: 'Kiloyu kilogram olarak gir (ör. 78).' };
  if (!(g >= 30 && g <= 300)) g = w;
  const mg = minGoalW(h);
  if (su.goal === 'ver' && g < mg) return { msg: `Bu boy için ${f1(mg)} kg altı, sağlıklı aralığın altında kalıyor. Hedef kiloyu ${f1(mg)} kg ya da üstü olarak belirleyelim.` };
  return { profile: { name: String(su.name || '').trim().slice(0, 24), sex: su.sex, age, h, w: r1(w), goalW: r1(g), act: +su.act, goal: su.goal, budget: +su.budget, manual: 0 } };
}

/* ---------- Yardımcılar ---------- */
const asName = () => String(S.profile && S.profile.name || '').trim();
function trGen(name) {
  // Türkçe iyelik eki: Ayberk'in, Ali'nin, Burcu'nun, Gül'ün
  const low = name.toLocaleLowerCase('tr-TR'), v = (low.match(/[aıoueiöü]/g) || ['e']).pop();
  const suf = 'aı'.includes(v) ? 'ın' : 'ei'.includes(v) ? 'in' : 'ou'.includes(v) ? 'un' : 'ün';
  return name + "'" + (/[aıoueiöü]$/.test(low) ? 'n' : '') + suf;
}
const asTitle = () => asName() ? trGen(asName()) + ' Akıllı Asistanı' : 'Akıllı Asistan';
const asH = d => d.getHours() + d.getMinutes() / 60;
const asAt = (dayK, h) => { const d = pdate(dayK); d.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0); return d; };
const asHM = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  const q = S.as.quiet, f = +q.from.slice(0, 2) * 60 + +q.from.slice(3), t = +q.to.slice(0, 2) * 60 + +q.to.slice(3), x = d.getHours() * 60 + d.getMinutes();
  return f === t ? false : f < t ? (x >= f && x < t) : (x >= f || x < t);
}

  const pool = AS_POOL[key], lvl = S.as.level, v = vars || {};
  const list = lvl === 'detayli' && pool.d && v.detail !== false ? pool.d : pool.v;
  let txt = list[hash(String(seed) + key) % list.length]; // aynı gün aynı metin, günler arasında değişir
  const ad = lvl !== 'sade' && asName() ? asName() + ', ' : '';
  txt = txt.replace(/\{(\w+)\}/g, (m, k) => k === 'ad' ? ad : (v[k] != null ? v[k] : ''));
  txt = txt.replace(/\s+/g, ' ').replace(/ \./g, '.').trim();
  return { title: pool.t, body: txt.charAt(0).toLocaleUpperCase('tr-TR') + txt.slice(1) };

/* ---------- Alışkanlık öğrenme (yalnızca yerel sayaçlar; sağlık ya da kişilik çıkarımı yapılmaz) ---------- */

  const meal = { k: 0, o: 0, a: 0, s: 0 }, hrs = { k: [], o: [], a: [], s: [] }; let days = 0;
  for (let i = 1; i <= 21; i++) {
    const k = addDays(tk, -i), d = S.days[k]; if (!d || !tot(k).n) continue; days++;
    for (const m of MEALS) {
      const its = (d.m[m.id] || []).filter(it => !(it.pl && !it.ok)); if (!its.length) continue;
      meal[m.id]++;

  }
  const med = a => a.length >= 3 ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;
  const wh = Object.keys(S.workouts).filter(k => S.workouts[k].ts && dkey(new Date(S.workouts[k].ts)) === k && didTrain(k)).map(k => asH(new Date(S.workouts[k].ts)));
  return { days, logs: m => days >= 7 ? meal[m] / days >= 0.4 : true, hour: m => med(hrs[m]), trainHour: med(wh), meal };
}
function asSlot(cat, def, lo, hi) {

  const o = (S.as.learn.open[cat] || []).slice(-12);
  if (o.length < 3) return def;

}
function asUse(now) {
  const L = S.as.learn, key = dkey(now) + '-' + now.getHours();
  if (L.lastUse === key) return false;
  L.lastUse = key; L.useH[now.getHours()]++; L.useD[now.getDay()]++; return true;
}
function asResp(cat, action, when) {
  const L = S.as.learn, d = when || new Date();
  (L.resp[cat] = L.resp[cat] || []).push({ a: action, d: dkey(d) }); L.resp[cat] = L.resp[cat].slice(-30);
  if (action === 'open' || action === 'useful') { (L.open[cat] = L.open[cat] || []).push(r1(asH(d))); L.open[cat] = L.open[cat].slice(-20); }
}

  // Son 14 günün tepkileri: çok kapatılan kategori seyrelir, üst üste "gereksiz" denirse 7 gün susar
  const r = (S.as.learn.resp[cat] || []).filter(x => dayDiff(tk, x.d) <= 14);
  const n = a => r.filter(x => x.a === a).length, pos = n('open') + n('useful');
  if (n('useless') >= 3 && pos === 0 && !(S.as.pause[cat] && S.as.pause[cat] >= tk)) { S.as.pause[cat] = addDays(tk, 7); S.as.learn.resp[cat] = []; return 'pause'; }
  if (S.as.pause[cat] && S.as.pause[cat] >= tk) return 'pause';
  return n('dismiss') + 2 * n('useless') - 2 * pos >= 4 ? 'less' : 'ok';

/* ---------- Veriden okunan gerçekler ---------- */
function asFavProtein() {
  // Kullanıcının sık yediği, porsiyonu en az 10 g protein içeren yiyecekler
  return Object.entries(S.freq).sort((a, b) => b[1] - a[1]).map(e => foodByKey(e[0])).filter(f => f && f.p >= 10).slice(0, 2);
}
function asWeekTrain(tk) { const w0 = weekStart(tk); let n = 0; for (let i = 0; i < 7; i++) if (didTrain(addDays(w0, i))) n++; return n; }

  let best = null;
  for (const r of RKEYS) { let d = null; for (let i = 0; i < 60; i++) if (trained(addDays(tk, -i)).has(r)) { d = i; break; } if (d !== null && d >= 7 && (!best || d > best.d)) best = { r, d }; }
  return best;
}
function asWeight(tk) {
  // 7 günlük ortalamaları karşılaştırır; tek ölçümle yorum yapmaz
  const ks = Object.keys(S.weights).sort(), win = (a, b) => ks.filter(k => dayDiff(tk, k) >= a && dayDiff(tk, k) <= b).map(k => S.weights[k]);
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length, c = win(0, 6), p = win(7, 13), pp = win(14, 20), last = ks[ks.length - 1] || null;

}
function asPrevEx(name, tk) {
  const keys = Object.keys(S.workouts).filter(k => k < tk).sort().reverse();
  for (const k of keys) { const e = (S.workouts[k].ex || []).filter(x => x.n === name).pop(); if (e) return e; }
  return null;
}

  const w = S.workouts[tk], out = []; if (!w) return out;
  for (const e of w.ex || []) {
    const p = asPrevEx(e.n, tk); if (!p) continue;
    if ((e.kg || 0) > (p.kg || 0) || ((e.kg || 0) === (p.kg || 0) && e.rp * e.s > p.rp * p.s)) out.push({ n: e.n, eski: exTxt(p), yeni: exTxt(e) });
  }

}

/* ---------- PLAN: önümüzdeki günler için bildirim kararları ----------
   Uygulama kapalıyken JavaScript çalışmaz. Bu yüzden her açılışta ve her kayıttan sonra plan baştan kurulur;
   ileri tarihli hatırlatmalar "uygulama o zamana kadar açılmadıysa" doğru olacak şekilde yazılır. */
function asPlan(now) {
  const A = S.as; if (!A.on || !S.profile) return [];
  const tk = dkey(now), h = asH(now), c = calc(), t = tot(tk), d = dayOf(tk), hb = asHabits(tk), fq = AS_FREQ[A.freq] || AS_FREQ.normal;
  const cand = [];
  const add = (day, hour, cat, key, vars, prio) => { const at = asAt(day, hour); if (at - now >= 3 * 60000) cand.push({ day, at, cat, key, vars: vars || {}, prio }); };
  const has = m => (d.m[m] || []).some(it => !(it.pl && !it.ok));
  const fav = asFavProtein(), oneri = fav.length ? ' Örneğin ' + fav.map(f => f.n.toLocaleLowerCase('tr-TR')).join(' ya da ') + '.' : '';
  const pv = ogun => ({ ogun, p: fmt(t.p), pt: fmt(c.prot), kalan: fmt(Math.max(0, c.prot - t.p)), hedef: clamp(r0((c.prot - t.p) * 0.6 / 5) * 5, 20, 45), oneri }); // tek öğün için gerçekçi miktar

    if (!has('o') && t.p < c.prot * 0.13) add(tk, lunchH, 'bes', 'bes.protein', pv('Öğle'), 2);
    if (!has('a') && t.p < c.prot * 0.48) add(tk, dinH, 'bes', 'bes.protein', pv('Akşam'), 3);
    if (!has('a') && hb.logs('a')) add(tk, 20.75, 'bes', 'bes.dinner', null, 1);
  }

    add(tk, asSlot('su', sh, sh - 1.5, sh + 1.5), 'su', 'su', { w, wt: AS_WATER, wk: AS_WATER - w }, 1);
  const trainH = clamp(asSlot('ant', (hb.trainHour ?? 18.5) - 1, 6.5, 21), 6.5, 21), wh = S.trainDays.length, ng = asNeglect(tk);
  const av = day => ({ wn: asWeekTrain(day), wh, ihmal: ng ? ' ' + REGIONS[ng.r] + ' ' + ng.d + ' gündür çalışılmadı.' : '' });
  if (S.trainDays.includes(now.getDay()) && !didTrain(tk)) add(tk, trainH, 'ant', 'ant.day', av(tk), 3);
  const wg = asWeight(tk);
  // --- Sonraki 3 gün: uygulama açılmazsa geçerli olacak hatırlatmalar

  const lastK = A.log.filter(l => l.cat === 'kilo' && l.st !== 'app').map(l => l.at).sort().pop(); // yanıtsız kalırsa en fazla 3 günde bir
  if (lastK && dayDiff(wDay, dkey(new Date(lastK))) < 3) wDay = addDays(dkey(new Date(lastK)), 3);

  }

/* ---------- Anlık olaylar: gerçek başarılar (yalnızca veride görülenler) ---------- */

/* ---------- Asistan ekranı için değerlendirme (eksik veride tahmin yürütmez) ---------- */

  // Akıllı asistan: kullanım saatini kaydet, planı kur, iOS köprüsüne hazır olduğunu bildir
  try { const nat = nativeApp(); if (nat) nat.postMessage({ type: 'notifReady' }); } catch (e) {}
  asWake();
  setInterval(asTick, 60000);
  // PWA manifesti (yalnızca http/https üzerinden açıldığında)
  try {
    if (/^https?:$/.test(location.protocol)) {
      const icon = document.querySelector('link[rel="apple-touch-icon"]').href, start = location.href.split('#')[0];
      const mf = { name: 'Sofra ve Spor', short_name: 'Sofra Spor', lang: 'tr', start_url: start, scope: start, display: 'standalone', orientation: 'portrait', background_color: '#F2F4F8', theme_color: '#1557C8', icons: [{ src: icon, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)); document.head.appendChild(l);
    }
  } catch (e) {}
  Cloud.init();
})();
</script>
